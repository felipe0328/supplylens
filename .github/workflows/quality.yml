name: Quality checks

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: >-
    quality-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed files
    runs-on: ubuntu-latest
    outputs:
      all_files: ${{ steps.detect.outputs.all_files }}
      base_sha: ${{ steps.detect.outputs.base_sha }}
      head_sha: ${{ steps.detect.outputs.head_sha }}
      backend: ${{ steps.detect.outputs.backend }}
      web: ${{ steps.detect.outputs.web }}
      version: ${{ steps.detect.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find changed files
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          all_files=false
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$EVENT_BASE_SHA"
          elif [[ -n "$EVENT_BEFORE" && ! "$EVENT_BEFORE" =~ ^0+$ ]]; then
            base_sha="$EVENT_BEFORE"
          elif [[ "$REF_NAME" != "$DEFAULT_BRANCH" ]] && \
               git show-ref --verify --quiet "refs/remotes/origin/$DEFAULT_BRANCH"; then
            base_sha="$(git merge-base "$HEAD_SHA" "origin/$DEFAULT_BRANCH")"
          elif git rev-parse --verify "${HEAD_SHA}^" >/dev/null 2>&1; then
            base_sha="$(git rev-parse "${HEAD_SHA}^")"
          else
            base_sha="$HEAD_SHA"
            all_files=true
          fi

          if [[ "$all_files" == "true" ]]; then
            changed_files="$(git ls-files)"
          else
            changed_files="$(git diff --name-only --diff-filter=ACMR "$base_sha" "$HEAD_SHA")"
          fi

          backend=false
          if grep -Eq \
            '^(apps/backend/|compose\.yaml$|Makefile$|scripts/check_coverage\.py$)' \
            <<<"$changed_files"; then
            backend=true
          fi

          web=false
          if grep -Eq '^apps/web/' <<<"$changed_files"; then
            web=true
          fi

          version=false
          if grep -Eq \
            '^(\.github/scripts/|\.github/workflows/version-bump\.yml$|VERSION$)' \
            <<<"$changed_files"; then
            version=true
          fi

          {
            echo "all_files=$all_files"
            echo "base_sha=$base_sha"
            echo "head_sha=$HEAD_SHA"
            echo "backend=$backend"
            echo "web=$web"
            echo "version=$version"
          } >>"$GITHUB_OUTPUT"

          echo "Changed files:"
          printf '%s\n' "$changed_files"

  checks:
    name: Lint and frontend checks
    needs: changes
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: latest-known
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Set up Node.js
        if: needs.changes.outputs.web == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        if: needs.changes.outputs.web == 'true'
        run: npm ci --prefix apps/web

      - name: Run pre-commit on changed files
        env:
          ALL_FILES: ${{ needs.changes.outputs.all_files }}
          BASE_SHA: ${{ needs.changes.outputs.base_sha }}
          HEAD_SHA: ${{ needs.changes.outputs.head_sha }}
          SKIP: backend-tests-coverage,web-unit-tests,version-script-tests
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$ALL_FILES" == "true" ]]; then
            uvx --from pre-commit==4.6.2 pre-commit run --all-files --show-diff-on-failure
          else
            uvx --from pre-commit==4.6.2 pre-commit run \
              --from-ref "$BASE_SHA" \
              --to-ref "$HEAD_SHA" \
              --show-diff-on-failure
          fi

      - name: Test version automation
        if: needs.changes.outputs.version == 'true'
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Enforce frontend coverage thresholds
        if: needs.changes.outputs.web == 'true'
        working-directory: apps/web
        run: npm run test:coverage

  backend:
    name: Backend tests and migrations
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_DB: supplylens_test
          POSTGRES_USER: supplylens
          POSTGRES_PASSWORD: localdev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supplylens -d supplylens_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: latest-known
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock

      - name: Sync backend dependencies
        run: uv sync --project apps/backend --locked

      - name: Enforce backend coverage threshold
        working-directory: apps/backend
        run: >-
          uv run pytest
          -m "not integration"
          --cov=supplylens
          --cov-report=term-missing
          --cov-fail-under=100

      - name: Start disposable MinIO
        run: docker compose --profile test up -d --wait minio-test

      - name: Test migrations on clean PostgreSQL
        working-directory: apps/backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://supplylens:localdev@127.0.0.1:5432/supplylens_test
        run: uv run pytest -m integration tests/integration

  quality:
    name: Changed files and coverage
    if: always()
    needs: [changes, checks, backend]
    runs-on: ubuntu-latest

    steps:
      - name: Require all applicable checks to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
        run: |
          set -euo pipefail
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Changed-file detection did not succeed."
            exit 1
          fi
          if [[ "$CHECKS_RESULT" != "success" ]]; then
            echo "Lint or frontend checks did not succeed."
            exit 1
          fi
          if [[ "$BACKEND_RESULT" != "success" && "$BACKEND_RESULT" != "skipped" ]]; then
            echo "Backend checks did not succeed."
            exit 1
          fi
