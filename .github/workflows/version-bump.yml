name: Version bump on merged PR

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  bump-version:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine bump type
        id: bump
        uses: actions/github-script@v7
        with:
          script: |
            const labels = (context.payload.pull_request.labels || []).map((label) => label.name.toLowerCase());
            const title = (context.payload.pull_request.title || '').toLowerCase();
            let bump = 'feature';

            if (labels.includes('major') || title.startsWith('major:') || title.includes('breaking')) {
              bump = 'major';
            } else if (labels.includes('minor') || title.startsWith('minor:')) {
              bump = 'minor';
            } else if (
              labels.includes('feature') ||
              labels.includes('enhancement') ||
              title.startsWith('feat:') ||
              title.startsWith('feature:') ||
              title.includes('new feature')
            ) {
              bump = 'feature';
            }

            core.setOutput('value', bump);

      - name: Bump version
        run: python3 .github/scripts/bump_version.py --bump ${{ steps.bump.outputs.value }} --version-file VERSION

      - name: Commit version bump
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add VERSION README.md apps/backend/pyproject.toml apps/web/package.json
          if git diff --cached --quiet; then
            echo "No version change needed."
            exit 0
          fi

          git commit -m "chore: bump version for ${{ steps.bump.outputs.value }} release"
          git push origin HEAD:main
