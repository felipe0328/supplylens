name: Version bump on merged PR

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  bump-version:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine bump type
        id: bump
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          bump="$(python3 .github/scripts/bump_version.py --print-bump)"
          echo "value=${bump}" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: latest-known

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Bump version
        run: python3 .github/scripts/bump_version.py --bump ${{ steps.bump.outputs.value }} --version-file VERSION

      - name: Refresh dependency locks
        run: |
          uv lock --project apps/backend
          npm install --prefix apps/web --package-lock-only --ignore-scripts

      - name: Commit version bump
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add VERSION README.md \
            apps/backend/pyproject.toml apps/backend/uv.lock \
            apps/web/package.json apps/web/package-lock.json
          if git diff --cached --quiet; then
            echo "No version change needed."
            exit 0
          fi

          git commit -m "chore: bump version for ${{ steps.bump.outputs.value }} release"
          git push origin HEAD:main
