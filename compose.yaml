services:
  db:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    environment:
      POSTGRES_DB: supplylens
      POSTGRES_USER: supplylens
      POSTGRES_PASSWORD: localdev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supplylens -d supplylens"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

volumes:
  postgres_data: