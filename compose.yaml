services:
  db:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    environment:
      POSTGRES_DB: supplylens
      POSTGRES_USER: supplylens
      POSTGRES_PASSWORD: localdev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supplylens -d supplylens"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  db-test:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    profiles: ["test"]
    environment:
      POSTGRES_DB: supplylens_test
      POSTGRES_USER: supplylens
      POSTGRES_PASSWORD: localdev
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supplylens -d supplylens_test"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 10s

  minio-test:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    profiles: ["test"]
    ports:
      - "127.0.0.1:9002:9000"
    environment:
      MINIO_ROOT_USER: supplylens-test
      MINIO_ROOT_PASSWORD: supplylens-test-only
    tmpfs:
      - /data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: supplylens
      MINIO_ROOT_PASSWORD: supplylens-dev
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"


volumes:
  postgres_data:
  minio_data:
