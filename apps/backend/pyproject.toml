[project]
name = "supplylens"
version = "0.11.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Oscar Puentes", email = "feliipepuentes@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "boto3>=1.43.105",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.6",
    "pydantic[email]>=2.13.5",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.1.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.0.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "ruff==0.16.9",
    "types-boto3[s3]>=1.43.105",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
markers = [
    "integration: tests that require disposable PostgreSQL or MinIO services",
    "r2_smoke: explicitly opted-in smoke tests against a dedicated Cloudflare R2 test bucket",
]
python_files = ["test_*.py", "*_test.py"]
testpaths = ["src"]

[tool.ruff]
line-length = 88
extend-exclude = ["alembic/versions/**"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
